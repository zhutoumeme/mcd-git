[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcd-git"
version = "0.2.3"
description = "用 git 命令点麦当劳：add 进购物车，rebase 凑最省，push 才真正下单（非官方，基于麦当劳 MCP Server）"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhutoumeme" }]
keywords = ["mcp", "git", "cli", "mcdonalds", "agent-skill", "1024"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
# 运行时依赖只有两个，全部锁死精确版本
dependencies = [
    "rich==14.3.0",
    "qrcode==8.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[project.urls]
Homepage = "https://github.com/zhutoumeme/mcd-git"

[project.scripts]
# git-mcd 放进 PATH 后，git 会把 `git mcd ...` 分发给它
git-mcd = "mcd_git.cli:main"
mcd-git = "mcd_git.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
