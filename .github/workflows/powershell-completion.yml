name: PowerShell completion

on:
  push:
    branches: [main]
  pull_request:

jobs:
  powershell:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    env:
      MCD_GIT_POWERSHELL: ${{ matrix.shell }}
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Load and execute generated completion
        run: python -m pytest tests/test_completion.py -k powershell
